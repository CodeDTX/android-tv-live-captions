name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em-dashes
        run: scripts/check-dashes.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The speech models are about 40 MB each and never change for a given name.
      # Bump the key when app/build.gradle.kts changes speechModels.
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-*
          key: speech-models-en-us-0.15-hi-0.22

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: live-captions-debug
          path: app/build/outputs/apk/debug/app-debug.apk
